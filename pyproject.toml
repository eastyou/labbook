[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "labbook"
version = "0.1.0"
description = "实验记录单生成器：把实验清单 CSV 变成可打印的 A4 记录单"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "teacher", "laboratory", "worksheet", "print", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]

[project.scripts]
labbook = "labbook.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/labbook"
Source = "https://github.com/eastyou/labbook"

[tool.setuptools]
packages = ["labbook"]
